<!DOCTYPE html>
<html>
<head>
    <title>Auth Test</title>
</head>
<body>
    <h1>Authentication Test</h1>
    <button onclick="testAuth()">Test Authentication</button>
    <button onclick="login()">Login</button>
    <div id="result"></div>
    
    <script>
        function login() {
            fetch('http://localhost:8001/api/v1/auth/login-json', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                credentials: 'include',
                body: JSON.stringify({
                    email: 'admin@schedium.edu',
                    password: 'admin123'
                })
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('result').innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
                console.log('Login result:', data);
            })
            .catch(error => {
                document.getElementById('result').innerHTML = 'Login error: ' + error.message;
                console.error('Login error:', error);
            });
        }
        
        function testAuth() {
            fetch('http://localhost:8001/api/v1/academic-config/time-blocks', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                credentials: 'include',
                body: JSON.stringify({
                    start_time: '20:00',
                    end_time: '22:00',
                    name: 'Browser Test Block'
                })
            })
            .then(response => {
                console.log('Response status:', response.status);
                return response.json();
            })
            .then(data => {
                document.getElementById('result').innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
                console.log('Test result:', data);
            })
            .catch(error => {
                document.getElementById('result').innerHTML = 'Test error: ' + error.message;
                console.error('Test error:', error);
            });
        }
    </script>
</body>
</html>
