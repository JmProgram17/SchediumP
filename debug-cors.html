<!DOCTYPE html>
<html>
<head>
    <title>Debug CORS Issue</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
    <h1>Debug CORS Issue</h1>
    <button onclick="testLogin()">Test Login (Clean Axios)</button>
    <button onclick="testWithFetch()">Test Login (Fetch API)</button>
    <div id="result" style="margin-top: 20px; padding: 10px; border: 1px solid #ccc;"></div>

    <script>
        // Test with clean axios instance
        async function testLogin() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing with Axios...';
            
            try {
                // Create completely clean axios instance
                const cleanAxios = axios.create({
                    timeout: 30000,
                    withCredentials: false,
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    }
                });
                
                const formData = new URLSearchParams();
                formData.append('username', 'admin@schedium.edu');
                formData.append('password', 'admin123');
                
                console.log('Making request to:', 'http://localhost:8001/api/v1/auth/login');
                console.log('Form data:', formData.toString());
                
                const response = await cleanAxios.post('http://localhost:8001/api/v1/auth/login', formData);
                
                console.log('Response:', response);
                resultDiv.innerHTML = `
                    <h3>✅ Axios Success!</h3>
                    <p><strong>Status:</strong> ${response.status}</p>
                    <p><strong>Success:</strong> ${response.data.success}</p>
                    <p><strong>Token:</strong> ${response.data.data?.access_token?.substring(0, 50)}...</p>
                `;
                
            } catch (error) {
                console.error('Axios error:', error);
                resultDiv.innerHTML = `
                    <h3>❌ Axios Failed</h3>
                    <p><strong>Error:</strong> ${error.message}</p>
                    <p><strong>Code:</strong> ${error.code}</p>
                    <p><strong>Response:</strong> ${error.response ? JSON.stringify(error.response.data) : 'No response'}</p>
                `;
            }
        }
        
        // Test with native fetch API
        async function testWithFetch() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing with Fetch...';
            
            try {
                const formData = new URLSearchParams();
                formData.append('username', 'admin@schedium.edu');
                formData.append('password', 'admin123');
                
                console.log('Making fetch request...');
                
                const response = await fetch('http://localhost:8001/api/v1/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: formData,
                    credentials: 'omit'
                });
                
                console.log('Fetch response:', response);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                console.log('Fetch data:', data);
                
                resultDiv.innerHTML = `
                    <h3>✅ Fetch Success!</h3>
                    <p><strong>Status:</strong> ${response.status}</p>
                    <p><strong>Success:</strong> ${data.success}</p>
                    <p><strong>Token:</strong> ${data.data?.access_token?.substring(0, 50)}...</p>
                `;
                
            } catch (error) {
                console.error('Fetch error:', error);
                resultDiv.innerHTML = `
                    <h3>❌ Fetch Failed</h3>
                    <p><strong>Error:</strong> ${error.message}</p>
                `;
            }
        }
    </script>
</body>
</html>
