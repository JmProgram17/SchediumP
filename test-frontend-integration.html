<!DOCTYPE html>
<html>
<head>
    <title>Frontend Integration Test</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
    <h1>Frontend-Backend Integration Test</h1>
    <button onclick="testFullAuth()">Test Full Authentication Flow</button>
    <div id="result" style="margin-top: 20px; padding: 10px; border: 1px solid #ccc;"></div>

    <script>
        async function testFullAuth() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing...';
            
            try {
                // Step 1: Login
                const formData = new URLSearchParams();
                formData.append('username', 'admin@schedium.edu');
                formData.append('password', 'admin123');
                
                const loginResponse = await axios.post('http://localhost:8001/api/v1/auth/login', formData, {
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    withCredentials: false
                });
                
                console.log('Login response:', loginResponse.data);
                
                if (!loginResponse.data.success) {
                    throw new Error('Login failed: ' + loginResponse.data.message);
                }
                
                const accessToken = loginResponse.data.data.access_token;
                
                // Step 2: Get user info
                const userResponse = await axios.get('http://localhost:8001/api/v1/auth/me', {
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json'
                    },
                    withCredentials: false
                });
                
                console.log('User response:', userResponse.data);
                
                if (!userResponse.data.success) {
                    throw new Error('Get user failed: ' + userResponse.data.message);
                }
                
                resultDiv.innerHTML = `
                    <h3>✅ Integration Successful!</h3>
                    <p><strong>User:</strong> ${userResponse.data.data.first_name} ${userResponse.data.data.last_name}</p>
                    <p><strong>Email:</strong> ${userResponse.data.data.email}</p>
                    <p><strong>Role:</strong> ${userResponse.data.data.role.name}</p>
                    <p><strong>Token:</strong> ${accessToken.substring(0, 50)}...</p>
                `;
                
            } catch (error) {
                console.error('Integration test failed:', error);
                resultDiv.innerHTML = `
                    <h3>❌ Integration Failed</h3>
                    <p><strong>Error:</strong> ${error.message}</p>
                    <p><strong>Details:</strong> ${error.response ? JSON.stringify(error.response.data) : 'No response data'}</p>
                `;
            }
        }
    </script>
</body>
</html>
