<!DOCTYPE html>
<html>
<head>
    <title>Quick Test</title>
    <style>
        body { font-family: monospace; margin: 20px; }
        iframe { width: 100%; height: 600px; border: 2px solid #333; }
        .status { margin: 10px 0; padding: 10px; background: #f0f0f0; }
    </style>
</head>
<body>
    <h1>🔍 Quick Login Test</h1>
    
    <div class="status" id="status">Loading...</div>
    
    <iframe src="http://localhost:3000/login" id="test-frame"></iframe>
    
    <script>
        document.getElementById('test-frame').onload = function() {
            document.getElementById('status').innerHTML = '✅ Iframe loaded at ' + new Date().toLocaleTimeString();
        };
        
        document.getElementById('test-frame').onerror = function(e) {
            document.getElementById('status').innerHTML = '❌ Iframe error: ' + e;
        };
    </script>
</body>
</html>
