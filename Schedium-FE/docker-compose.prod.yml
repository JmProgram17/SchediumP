version: '3.8'

services:
  # Frontend Application
  schedium-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VERSION: 18.20.0
        BUILD_ENV: production
    image: schedium/frontend:latest
    container_name: schedium-frontend-prod
    restart: unless-stopped
    
    ports:
      - "80:80"
      - "443:443"
    
    environment:
      - NODE_ENV=production
      - VITE_API_BASE_URL=${API_BASE_URL:-http://api:8000}
      - VITE_APP_VERSION=${APP_VERSION:-1.0.0}
      - VITE_SENTRY_DSN=${SENTRY_DSN}
      - VITE_ENVIRONMENT=production
    
    volumes:
      - nginx_logs:/var/log/nginx
      - ssl_certs:/etc/nginx/ssl:ro
      - static_files:/usr/share/nginx/html/static
    
    networks:
      - schedium-network
      - traefik-network
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    labels:
      # Traefik configuration
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-network"
      
      # HTTP to HTTPS redirect
      - "traefik.http.routers.schedium-frontend-http.rule=Host(`${FRONTEND_DOMAIN}`)"
      - "traefik.http.routers.schedium-frontend-http.entrypoints=web"
      - "traefik.http.routers.schedium-frontend-http.middlewares=https-redirect"
      
      # HTTPS configuration
      - "traefik.http.routers.schedium-frontend.rule=Host(`${FRONTEND_DOMAIN}`)"
      - "traefik.http.routers.schedium-frontend.entrypoints=websecure"
      - "traefik.http.routers.schedium-frontend.tls=true"
      - "traefik.http.routers.schedium-frontend.tls.certresolver=letsencrypt"
      
      # Service configuration
      - "traefik.http.services.schedium-frontend.loadbalancer.server.port=80"
      
      # Security headers
      - "traefik.http.routers.schedium-frontend.middlewares=security-headers,compression"
      
      # Monitoring labels
      - "prometheus.io/scrape=true"
      - "prometheus.io/port=80"
      - "prometheus.io/path=/metrics"
    
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 60s
      rollback_config:
        parallelism: 1
        delay: 10s
        monitor: 60s

  # Reverse Proxy & Load Balancer
  traefik:
    image: traefik:v3.0
    container_name: schedium-traefik
    restart: unless-stopped
    
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Dashboard
    
    command:
      # API and Dashboard
      - --api.dashboard=true
      - --api.insecure=false
      
      # Entry points
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      
      # Docker provider
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=traefik-network
      
      # Let's Encrypt
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      
      # Logging
      - --log.level=INFO
      - --accesslog=true
      - --accesslog.filepath=/var/log/traefik/access.log
      
      # Metrics
      - --metrics.prometheus=true
      - --metrics.prometheus.buckets=0.1,0.3,1.2,5.0
    
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
      - traefik_logs:/var/log/traefik
    
    networks:
      - traefik-network
    
    labels:
      # Dashboard configuration
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.${FRONTEND_DOMAIN}`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls=true"
      - "traefik.http.routers.traefik.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.middlewares=auth"
      
      # Basic auth for dashboard
      - "traefik.http.middlewares.auth.basicauth.users=${TRAEFIK_AUTH_USER}"
      
      # HTTPS redirect
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=true"
      
      # Security headers
      - "traefik.http.middlewares.security-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.security-headers.headers.sslRedirect=true"
      - "traefik.http.middlewares.security-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.security-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.security-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.security-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.security-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.security-headers.headers.stsSeconds=31536000"
      
      # Compression
      - "traefik.http.middlewares.compression.compress=true"

  # Monitoring - Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: schedium-prometheus
    restart: unless-stopped
    
    ports:
      - "9090:9090"
    
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    
    networks:
      - schedium-network
    
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.${FRONTEND_DOMAIN}`)"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.routers.prometheus.tls=true"
      - "traefik.http.routers.prometheus.middlewares=auth"

  # Monitoring - Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: schedium-grafana
    restart: unless-stopped
    
    ports:
      - "3000:3000"
    
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_DOMAIN=${FRONTEND_DOMAIN}
      - GF_SERVER_ROOT_URL=https://grafana.${FRONTEND_DOMAIN}
    
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    
    networks:
      - schedium-network
    
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.${FRONTEND_DOMAIN}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls=true"

  # Log Aggregation
  loki:
    image: grafana/loki:latest
    container_name: schedium-loki
    restart: unless-stopped
    
    ports:
      - "3100:3100"
    
    volumes:
      - ./monitoring/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    
    command: -config.file=/etc/loki/local-config.yaml
    
    networks:
      - schedium-network

  # Log Collection
  promtail:
    image: grafana/promtail:latest
    container_name: schedium-promtail
    restart: unless-stopped
    
    volumes:
      - ./monitoring/promtail.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - nginx_logs:/var/log/nginx:ro
      - traefik_logs:/var/log/traefik:ro
    
    command: -config.file=/etc/promtail/config.yml
    
    networks:
      - schedium-network

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: schedium-redis
    restart: unless-stopped
    
    ports:
      - "6379:6379"
    
    volumes:
      - redis_data:/data
    
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    
    networks:
      - schedium-network
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Database backup service
  db-backup:
    image: postgres:15-alpine
    container_name: schedium-db-backup
    restart: unless-stopped
    
    environment:
      - PGPASSWORD=${DB_PASSWORD}
    
    volumes:
      - db_backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    
    command: >
      sh -c "
        apk add --no-cache dcron &&
        echo '0 2 * * * /backup.sh' | crontab - &&
        crond -f -d 8
      "
    
    networks:
      - schedium-network

volumes:
  nginx_logs:
    driver: local
  ssl_certs:
    driver: local
  static_files:
    driver: local
  traefik_letsencrypt:
    driver: local
  traefik_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
  redis_data:
    driver: local
  db_backups:
    driver: local

networks:
  schedium-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
  
  traefik-network:
    driver: bridge
    external: true