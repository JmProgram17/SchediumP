    <!-- SERVICE WORKER COMPLETELY DISABLED FOR DEVELOPMENT -->
    <script>
      console.log('🔧 DEVELOPMENT MODE: Service Worker deshabilitado');
      
      // AGGRESSIVE CLEANUP - Run immediately
      (async function() {
        try {
          console.log('🧹 Iniciando limpieza agresiva...');
          
          // 1. Unregister ALL service workers immediately
          if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            console.log(`🔍 Encontrados ${registrations.length} service workers`);
            
            for (let registration of registrations) {
              try {
                await registration.unregister();
                console.log(`✅ SW desregistrado: ${registration.scope}`);
              } catch (e) {
                console.error(`❌ Error desregistrando SW: ${e.message}`);
              }
            }
            
            // Double-check after 500ms
            setTimeout(async () => {
              const remaining = await navigator.serviceWorker.getRegistrations();
              if (remaining.length > 0) {
                console.warn(`⚠️ AUN QUEDAN ${remaining.length} SW!`);
                for (let reg of remaining) {
                  await reg.unregister();
                }
              } else {
                console.log('✅ Todos los SW eliminados');
              }
            }, 500);
          }
          
          // 2. Clear ALL caches
          if ('caches' in window) {
            const cacheNames = await caches.keys();
            console.log(`🗑️ Eliminando ${cacheNames.length} caches`);
            
            for (let cacheName of cacheNames) {
              await caches.delete(cacheName);
              console.log(`✅ Cache eliminado: ${cacheName}`);
            }
          }
          
          // 3. Clear storage
          try {
            localStorage.clear();
            sessionStorage.clear();
            console.log('✅ Storage limpiado');
          } catch (e) {
            console.log('⚠️ Storage:', e.message);
          }
          
          console.log('🎉 Limpieza completa - Modo desarrollo listo');
          
        } catch (error) {
          console.error('💥 Error en limpieza:', error);
          console.log('🔗 Si persisten problemas, ve a: /force-cleanup.html');
        }
      })();
      
      // Prevent any SW registration
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register = function() {
          console.log('🚫 Service Worker registration BLOCKED for development');
          return Promise.resolve();
        };
      }
      
      /* ORIGINAL PWA CODE - DISABLED FOR DEVELOPMENT

        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(registration => console.log('SW registered:', registration))
            .catch(error => console.log('SW registration failed:', error));
        });
      }
      
      // Handle PWA install prompt
      let deferredPrompt;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        // Dispatch custom event for app to handle
        window.dispatchEvent(new CustomEvent('pwa-install-available'));
      });
      */
